name: Gaming GitHub Status

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Gaming Status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: jadarkaribasu02-beep
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.parse

          username = os.environ["GITHUB_USERNAME"]
          token = os.environ["GH_TOKEN"]

          def api(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "github-actions"
                  }
              )
              with urllib.request.urlopen(req) as response:
                  return json.load(response)

          # User information
          user = api(f"https://api.github.com/users/{username}")

          repos = user.get("public_repos", 0)
          followers = user.get("followers", 0)

          # Public commit count
          query = urllib.parse.urlencode({
              "q": f"author:{username}",
              "per_page": "1"
          })

          commit_data = api(
              f"https://api.github.com/search/commits?{query}"
          )

          commits = commit_data.get("total_count", 0)

          # Calculate gaming level
          level = max(1, commits // 25 + 1)
          xp = commits % 25
          xp_percent = int((xp / 25) * 100)

          # Get repository stars
          stars = 0
          page = 1

          while True:
              data = api(
                  f"https://api.github.com/users/{username}/repos"
                  f"?per_page=100&page={page}"
              )

              if not data:
                  break

              for repo in data:
                  stars += repo.get("stargazers_count", 0)

              if len(data) < 100:
                  break

              page += 1

          # Progress bar
          filled = round(xp_percent / 10)
          empty = 10 - filled

          bar = "█" * filled + "░" * empty

          svg = f'''<svg width="900" height="420"
          viewBox="0 0 900 420"
          xmlns="http://www.w3.org/2000/svg">

          <defs>
            <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#0b1020"/>
              <stop offset="100%" stop-color="#15152f"/>
            </linearGradient>

            <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#00eaff"/>
              <stop offset="100%" stop-color="#9b5cff"/>
            </linearGradient>
          </defs>

          <rect width="900" height="420" rx="25"
                fill="url(#bg)"
                stroke="#2d3655"
                stroke-width="2"/>

          <rect x="25" y="25" width="850" height="4"
                rx="2"
                fill="url(#line)"/>

          <text x="55" y="85"
                fill="#00eaff"
                font-family="monospace"
                font-size="30"
                font-weight="bold">
            KARIBASU.EXE
          </text>

          <text x="55" y="115"
                fill="#777f9e"
                font-family="monospace"
                font-size="14">
            GITHUB DEVELOPER PROFILE
          </text>

          <text x="55" y="170"
                fill="#ffffff"
                font-family="monospace"
                font-size="20">
            LEVEL
          </text>

          <text x="180" y="170"
                fill="#00eaff"
                font-family="monospace"
                font-size="22"
                font-weight="bold">
            {level}
          </text>

          <text x="55" y="210"
                fill="#ffffff"
                font-family="monospace"
                font-size="20">
            XP
          </text>

          <text x="180" y="210"
                fill="#9b5cff"
                font-family="monospace"
                font-size="18">
            {bar} {xp_percent}%
          </text>

          <text x="55" y="260"
                fill="#8c95b3"
                font-family="monospace"
                font-size="16">
            COMMITS
          </text>

          <text x="180" y="260"
                fill="#ffffff"
                font-family="monospace"
                font-size="18">
            {commits}
          </text>

          <text x="55" y="295"
                fill="#8c95b3"
                font-family="monospace"
                font-size="16">
            REPOSITORIES
          </text>

          <text x="180" y="295"
                fill="#ffffff"
                font-family="monospace"
                font-size="18">
            {repos}
          </text>

          <text x="55" y="330"
                fill="#8c95b3"
                font-family="monospace"
                font-size="16">
            STARS
          </text>

          <text x="180" y="330"
                fill="#ffffff"
                font-family="monospace"
                font-size="18">
            {stars}
          </text>

          <text x="55" y="365"
                fill="#8c95b3"
                font-family="monospace"
                font-size="16">
            FOLLOWERS
          </text>

          <text x="180" y="365"
                fill="#ffffff"
                font-family="monospace"
                font-size="18">
            {followers}
          </text>

          <text x="570" y="185"
                fill="#00eaff"
                font-family="monospace"
                font-size="18"
                font-weight="bold">
            CLASS
          </text>

          <text x="570" y="220"
                fill="#ffffff"
                font-family="monospace"
                font-size="22">
            JAVA / BACKEND
          </text>

          <text x="570" y="280"
                fill="#00eaff"
                font-family="monospace"
                font-size="18"
                font-weight="bold">
            STATUS
          </text>

          <text x="570" y="315"
                fill="#ffffff"
                font-family="monospace"
                font-size="22">
            BUILDING...
          </text>

          <circle cx="555" cy="308" r="6"
                  fill="#00ff88"/>

          <text x="570" y="350"
                fill="#777f9e"
                font-family="monospace"
                font-size="13">
            SYSTEM ONLINE
          </text>

          </svg>'''

          os.makedirs("dist", exist_ok=True)

          with open("dist/gaming-status.svg", "w", encoding="utf-8") as f:
              f.write(svg)

          print("Gaming status generated successfully.")

      - name: Publish Gaming Card
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: profile-assets
          publish_dir: ./dist
