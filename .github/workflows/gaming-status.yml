name: Gaming GitHub Status

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Gaming Status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: jadarkaribasu02-beep

        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.parse
          from datetime import date, timedelta

          username = os.environ["GITHUB_USERNAME"]
          token = os.environ["GH_TOKEN"]

          # ==========================================
          # GITHUB API
          # ==========================================

          def api(url):

              req = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "github-actions"
                  }
              )

              with urllib.request.urlopen(req) as response:
                  return json.load(response)

          # ==========================================
          # USER INFORMATION
          # ==========================================

          user = api(
              f"https://api.github.com/users/{username}"
          )

          repos = user.get("public_repos", 0)
          followers = user.get("followers", 0)

          # ==========================================
          # PUBLIC COMMITS
          # ==========================================

          query = urllib.parse.urlencode({
              "q": f"author:{username}",
              "per_page": "1"
          })

          commit_data = api(
              f"https://api.github.com/search/commits?{query}"
          )

          commits = commit_data.get("total_count", 0)

          # ==========================================
          # CONTRIBUTION CALENDAR
          # ==========================================

          graphql_query = """
          query($login: String!) {
            user(login: $login) {
              contributionsCollection {
                contributionCalendar {
                  weeks {
                    contributionDays {
                      date
                      contributionCount
                    }
                  }
                }
              }
            }
          }
          """

          payload = json.dumps({
              "query": graphql_query,
              "variables": {
                  "login": username
              }
          }).encode("utf-8")

          req = urllib.request.Request(
              "https://api.github.com/graphql",
              data=payload,
              headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json",
                  "User-Agent": "github-actions"
              }
          )

          with urllib.request.urlopen(req) as response:
              contribution_data = json.load(response)

          weeks = contribution_data["data"]["user"][
              "contributionsCollection"
          ]["contributionCalendar"]["weeks"]

          contribution_days = []

          for week in weeks:
              for day_data in week["contributionDays"]:
                  contribution_days.append(day_data)

          contribution_days.sort(
              key=lambda x: x["date"]
          )

          contributions = {
              item["date"]: item["contributionCount"]
              for item in contribution_days
          }

          # ==========================================
          # CURRENT STREAK
          # ==========================================

          current_streak = 0

          current_day = date.today()

          while contributions.get(
              current_day.isoformat(), 0
          ) > 0:

              current_streak += 1

              current_day -= timedelta(days=1)

          # ==========================================
          # LONGEST STREAK
          # ==========================================

          longest_streak = 0
          running_streak = 0

          for item in contribution_days:

              if item["contributionCount"] > 0:

                  running_streak += 1

                  longest_streak = max(
                      longest_streak,
                      running_streak
                  )

              else:

                  running_streak = 0

          # ==========================================
          # GAMING LEVEL
          # ==========================================

          level = max(
              1,
              commits // 25 + 1
          )

          xp = commits % 25

          xp_percent = int(
              (xp / 25) * 100
          )

          filled = round(
              xp_percent / 10
          )

          empty = 10 - filled

          bar = "█" * filled + "░" * empty

          # ==========================================
          # REPOSITORY STARS
          # ==========================================

          stars = 0
          page = 1

          while True:

              data = api(
                  f"https://api.github.com/users/{username}/repos"
                  f"?per_page=100&page={page}"
              )

              if not data:
                  break

              for repo in data:

                  stars += repo.get(
                      "stargazers_count",
                      0
                  )

              if len(data) < 100:
                  break

              page += 1

          # ==========================================
          # LIGHT / CREAM GAMING CARD
          # ==========================================

          svg = f'''<svg
          width="900"
          height="450"
          viewBox="0 0 900 450"
          xmlns="http://www.w3.org/2000/svg">

          <defs>

            <linearGradient
              id="background"
              x1="0"
              y1="0"
              x2="1"
              y2="1">

              <stop
                offset="0%"
                stop-color="#FFFDF7"/>

              <stop
                offset="100%"
                stop-color="#F3E8D7"/>

            </linearGradient>

            <linearGradient
              id="accent"
              x1="0"
              y1="0"
              x2="1"
              y2="0">

              <stop
                offset="0%"
                stop-color="#B45309"/>

              <stop
                offset="100%"
                stop-color="#D97706"/>

            </linearGradient>

          </defs>


          <!-- BACKGROUND -->

          <rect
            width="900"
            height="450"
            rx="25"
            fill="url(#background)"
            stroke="#E4D5C3"
            stroke-width="2"/>


          <!-- TOP ACCENT -->

          <rect
            x="25"
            y="25"
            width="850"
            height="5"
            rx="3"
            fill="url(#accent)"/>


          <!-- TITLE -->

          <text
            x="55"
            y="85"
            fill="#92400E"
            font-family="monospace"
            font-size="30"
            font-weight="bold">

            KARIBASU.EXE

          </text>


          <text
            x="55"
            y="115"
            fill="#78716C"
            font-family="monospace"
            font-size="14">

            GITHUB DEVELOPER PROFILE

          </text>


          <!-- LEVEL -->

          <text
            x="55"
            y="165"
            fill="#57534E"
            font-family="monospace"
            font-size="18">

            LEVEL

          </text>


          <text
            x="190"
            y="165"
            fill="#B45309"
            font-family="monospace"
            font-size="21"
            font-weight="bold">

            {level}

          </text>


          <!-- XP -->

          <text
            x="55"
            y="200"
            fill="#57534E"
            font-family="monospace"
            font-size="18">

            XP

          </text>


          <text
            x="190"
            y="200"
            fill="#92400E"
            font-family="monospace"
            font-size="17">

            {bar} {xp_percent}%

          </text>


          <!-- COMMITS -->

          <text
            x="55"
            y="240"
            fill="#78716C"
            font-family="monospace"
            font-size="16">

            COMMITS

          </text>


          <text
            x="190"
            y="240"
            fill="#292524"
            font-family="monospace"
            font-size="18">

            {commits}

          </text>


          <!-- REPOSITORIES -->

          <text
            x="55"
            y="275"
            fill="#78716C"
            font-family="monospace"
            font-size="16">

            REPOSITORIES

          </text>


          <text
            x="190"
            y="275"
            fill="#292524"
            font-family="monospace"
            font-size="18">

            {repos}

          </text>


          <!-- STARS -->

          <text
            x="55"
            y="310"
            fill="#78716C"
            font-family="monospace"
            font-size="16">

            STARS

          </text>


          <text
            x="190"
            y="310"
            fill="#292524"
            font-family="monospace"
            font-size="18">

            {stars}

          </text>


          <!-- FOLLOWERS -->

          <text
            x="55"
            y="345"
            fill="#78716C"
            font-family="monospace"
            font-size="16">

            FOLLOWERS

          </text>


          <text
            x="190"
            y="345"
            fill="#292524"
            font-family="monospace"
            font-size="18">

            {followers}

          </text>


          <!-- CURRENT STREAK -->

          <text
            x="55"
            y="400"
            fill="#B45309"
            font-family="monospace"
            font-size="18"
            font-weight="bold">

            STREAK

          </text>


          <text
            x="190"
            y="400"
            fill="#292524"
            font-family="monospace"
            font-size="18">

            {current_streak} DAYS

          </text>


          <!-- RIGHT SIDE -->

          <text
            x="570"
            y="175"
            fill="#B45309"
            font-family="monospace"
            font-size="17"
            font-weight="bold">

            CLASS

          </text>


          <text
            x="570"
            y="210"
            fill="#292524"
            font-family="monospace"
            font-size="21">

            JAVA / BACKEND

          </text>


          <!-- STATUS -->

          <text
            x="570"
            y="270"
            fill="#B45309"
            font-family="monospace"
            font-size="17"
            font-weight="bold">

            STATUS

          </text>


          <text
            x="570"
            y="305"
            fill="#292524"
            font-family="monospace"
            font-size="21">

            BUILDING...

          </text>


          <!-- ONLINE DOT -->

          <circle
            cx="555"
            cy="298"
            r="6"
            fill="#16A34A"/>


          <!-- LONGEST STREAK -->

          <text
            x="570"
            y="350"
            fill="#78716C"
            font-family="monospace"
            font-size="13">

            LONGEST STREAK:

          </text>


          <text
            x="570"
            y="372"
            fill="#292524"
            font-family="monospace"
            font-size="16"
            font-weight="bold">

            {longest_streak} DAYS

          </text>


          <!-- SYSTEM -->

          <text
            x="570"
            y="405"
            fill="#A8A29E"
            font-family="monospace"
            font-size="12">

            SYSTEM ONLINE

          </text>


          </svg>'''

          # ==========================================
          # SAVE SVG
          # ==========================================

          os.makedirs(
              "dist",
              exist_ok=True
          )

          with open(
              "dist/gaming-status.svg",
              "w",
              encoding="utf-8"
          ) as file:

              file.write(svg)

          print(
              "Gaming status generated successfully."
          )

          print(
              "Current streak:",
              current_streak
          )

          print(
              "Longest streak:",
              longest_streak
          )


      # ==========================================
      # PUBLISH TO SEPARATE BRANCH
      # ==========================================

      - name: Publish Gaming Card
        uses: peaceiris/actions-gh-pages@v4

        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

          publish_branch: profile-assets

          publish_dir: ./dist
