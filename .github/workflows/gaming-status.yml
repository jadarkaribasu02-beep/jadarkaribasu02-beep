name: Gaming GitHub Status

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Generate Status Card
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: jadarkaribasu02-beep

        run: |

          python - <<'PY'

          import os
          import json
          import urllib.request
          import urllib.parse
          from datetime import date, timedelta


          username = os.environ["GITHUB_USERNAME"]
          token = os.environ["GH_TOKEN"]


          # ==========================================
          # GITHUB API
          # ==========================================

          def api(url):

              request = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "github-actions"
                  }
              )

              with urllib.request.urlopen(request) as response:
                  return json.load(response)


          # ==========================================
          # USER DATA
          # ==========================================

          user = api(
              f"https://api.github.com/users/{username}"
          )

          repos = user.get("public_repos", 0)
          followers = user.get("followers", 0)


          # ==========================================
          # COMMITS
          # ==========================================

          query = urllib.parse.urlencode({
              "q": f"author:{username}",
              "per_page": "1"
          })

          commit_data = api(
              f"https://api.github.com/search/commits?{query}"
          )

          commits = commit_data.get(
              "total_count",
              0
          )


          # ==========================================
          # CONTRIBUTION CALENDAR
          # ==========================================

          graphql_query = """

          query($login: String!) {

            user(login: $login) {

              contributionsCollection {

                contributionCalendar {

                  weeks {

                    contributionDays {

                      date

                      contributionCount

                    }

                  }

                }

              }

            }

          }

          """


          payload = json.dumps({

              "query": graphql_query,

              "variables": {
                  "login": username
              }

          }).encode("utf-8")


          request = urllib.request.Request(

              "https://api.github.com/graphql",

              data=payload,

              headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json",
                  "User-Agent": "github-actions"
              }

          )


          with urllib.request.urlopen(request) as response:

              contribution_data = json.load(response)


          weeks = (
              contribution_data["data"]
              ["user"]
              ["contributionsCollection"]
              ["contributionCalendar"]
              ["weeks"]
          )


          contribution_days = []


          for week in weeks:

              for day_data in week["contributionDays"]:

                  contribution_days.append(day_data)


          contribution_days.sort(
              key=lambda x: x["date"]
          )


          contributions = {

              item["date"]:
              item["contributionCount"]

              for item in contribution_days

          }


          # ==========================================
          # CURRENT STREAK
          # ==========================================

          current_streak = 0

          today = date.today()


          while contributions.get(
              today.isoformat(),
              0
          ) > 0:

              current_streak += 1

              today -= timedelta(days=1)


          # ==========================================
          # LONGEST STREAK
          # ==========================================

          longest_streak = 0

          running_streak = 0


          for item in contribution_days:

              if item["contributionCount"] > 0:

                  running_streak += 1

                  longest_streak = max(
                      longest_streak,
                      running_streak
                  )

              else:

                  running_streak = 0


          # ==========================================
          # GAMING LEVEL
          # ==========================================

          level = max(
              1,
              commits // 25 + 1
          )


          xp = commits % 25


          xp_percent = int(
              (xp / 25) * 100
          )


          # ==========================================
          # REPOSITORY STARS
          # ==========================================

          stars = 0

          page = 1


          while True:

              data = api(

                  f"https://api.github.com/users/"
                  f"{username}/repos"
                  f"?per_page=100&page={page}"

              )


              if not data:
                  break


              for repo in data:

                  stars += repo.get(
                      "stargazers_count",
                      0
                  )


              if len(data) < 100:
                  break


              page += 1


          # ==========================================
          # CREAM DESIGN
          # ==========================================

          svg = f'''

          <svg
            width="900"
            height="430"
            viewBox="0 0 900 430"
            xmlns="http://www.w3.org/2000/svg"
          >

            <!-- Cream Background -->

            <rect
              width="900"
              height="430"
              rx="24"
              fill="#F8F1E7"
            />


            <!-- Inner Card -->

            <rect
              x="18"
              y="18"
              width="864"
              height="394"
              rx="18"
              fill="#FFFDF9"
              stroke="#E6D8C7"
              stroke-width="2"
            />


            <!-- Header -->

            <text
              x="55"
              y="75"
              font-family="Arial, sans-serif"
              font-size="28"
              font-weight="700"
              fill="#3F3832"
            >
              KARIBASU
            </text>


            <text
              x="55"
              y="103"
              font-family="Arial, sans-serif"
              font-size="13"
              fill="#8A7F73"
            >
              DEVELOPER PROFILE
            </text>


            <!-- Divider -->

            <line
              x1="55"
              y1="125"
              x2="845"
              y2="125"
              stroke="#E6D8C7"
              stroke-width="2"
            />


            <!-- LEVEL -->

            <text
              x="55"
              y="165"
              font-family="Arial, sans-serif"
              font-size="13"
              fill="#8A7F73"
            >
              LEVEL
            </text>


            <text
              x="55"
              y="192"
              font-family="Arial, sans-serif"
              font-size="25"
              font-weight="700"
              fill="#5C4636"
            >
              {level}
            </text>


            <!-- XP -->

            <text
              x="145"
              y="165"
              font-family="Arial, sans-serif"
              font-size="13"
              fill="#8A7F73"
            >
              EXPERIENCE
            </text>


            <rect
              x="145"
              y="177"
              width="180"
              height="9"
              rx="5"
              fill="#E9DED1"
            />


            <rect
              x="145"
              y="177"
              width="{max(5, int(180 * xp_percent / 100))}"
              height="9"
              rx="5"
              fill="#B7794B"
            />


            <text
              x="335"
              y="187"
              font-family="Arial, sans-serif"
              font-size="13"
              fill="#8A7F73"
            >
              {xp_percent}%
            </text>


            <!-- STATS -->

            <text
              x="55"
              y="235"
              font-family="Arial, sans-serif"
              font-size="13"
              fill="#8A7F73"
            >
              COMMITS
            </text>


            <text
              x="55"
              y="260"
              font-family="Arial, sans-serif"
              font-size="20"
              font-weight="600"
              fill="#3F3832"
            >
              {commits}
            </text>


            <text
              x="175"
              y="235"
              font-family="Arial, sans-serif"
              font-size="13"
              fill="#8A7F73"
            >
              REPOSITORIES
            </text>


            <text
              x="175"
              y="260"
              font-family="Arial, sans-serif"
              font-size="20"
              font-weight="600"
              fill="#3F3832"
            >
              {repos}
            </text>


            <text
              x="330"
              y="235"
              font-family="Arial, sans-serif"
              font-size="13"
              fill="#8A7F73"
            >
              STARS
            </text>


            <text
              x="330"
              y="260"
              font-family="Arial, sans-serif"
              font-size="20"
              font-weight="600"
              fill="#3F3832"
            >
              {stars}
            </text>


            <text
              x="450"
              y="235"
              font-family="Arial, sans-serif"
              font-size="13"
              fill="#8A7F73"
            >
              FOLLOWERS
            </text>


            <text
              x="450"
              y="260"
              font-family="Arial, sans-serif"
              font-size="20"
              font-weight="600"
              fill="#3F3832"
            >
              {followers}
            </text>


            <!-- STREAK -->

            <rect
              x="55"
              y="290"
              width="420"
              height="80"
              rx="14"
              fill="#F5E7D5"
            />


            <text
              x="75"
              y="320"
              font-family="Arial, sans-serif"
              font-size="13"
              font-weight="600"
              fill="#9A623B"
            >
              CURRENT STREAK
            </text>


            <text
              x="75"
              y="350"
              font-family="Arial, sans-serif"
              font-size="23"
              font-weight="700"
              fill="#4A382D"
            >
              {current_streak} DAYS
            </text>


            <text
              x="270"
              y="320"
              font-family="Arial, sans-serif"
              font-size="13"
              font-weight="600"
              fill="#9A623B"
            >
              LONGEST
            </text>


            <text
              x="270"
              y="350"
              font-family="Arial, sans-serif"
              font-size="23"
              font-weight="700"
              fill="#4A382D"
            >
              {longest_streak} DAYS
            </text>


            <!-- RIGHT SIDE -->

            <text
              x="570"
              y="165"
              font-family="Arial, sans-serif"
              font-size="13"
              fill="#8A7F73"
            >
              CLASS
            </text>


            <text
              x="570"
              y="193"
              font-family="Arial, sans-serif"
              font-size="21"
              font-weight="600"
              fill="#4A382D"
            >
              JAVA / BACKEND
            </text>


            <text
              x="570"
              y="235"
              font-family="Arial, sans-serif"
              font-size="13"
              fill="#8A7F73"
            >
              STATUS
            </text>


            <circle
              cx="578"
              cy="255"
              r="5"
              fill="#6E9B70"
            />


            <text
              x="592"
              y="261"
              font-family="Arial, sans-serif"
              font-size="17"
              font-weight="600"
              fill="#4A382D"
            >
              BUILDING
            </text>


            <text
              x="570"
              y="305"
              font-family="Arial, sans-serif"
              font-size="13"
              fill="#8A7F73"
            >
              CONTRIBUTION MODE
            </text>


            <text
              x="570"
              y="332"
              font-family="Arial, sans-serif"
              font-size="16"
              fill="#5C5148"
            >
              KEEP BUILDING.
            </text>


            <text
              x="570"
              y="358"
              font-family="Arial, sans-serif"
              font-size="13"
              fill="#A09387"
            >
              updated automatically
            </text>


          </svg>
          '''


          # ==========================================
          # SAVE
          # ==========================================

          os.makedirs(
              "dist",
              exist_ok=True
          )


          with open(
              "dist/gaming-status.svg",
              "w",
              encoding="utf-8"
          ) as file:

              file.write(svg)


          print(
              "Gaming status generated successfully."
          )

          print(
              "Current streak:",
              current_streak
          )

          print(
              "Longest streak:",
              longest_streak
          )


      # ==========================================
      # PUBLISH
      # ==========================================

      - name: Publish Gaming Card
        uses: peaceiris/actions-gh-pages@v4

        with:

          github_token: ${{ secrets.GITHUB_TOKEN }}

          publish_branch: profile-assets

          publish_dir: ./dist
